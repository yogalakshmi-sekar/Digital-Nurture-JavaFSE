<h3>All Courses</h3>

<div class="search-row">
  <input
    type="text"
    placeholder="Search by name or code..."
    [(ngModel)]="searchTerm"
    name="searchTerm"
    (ngModelChange)="onSearchChange()" />
</div>

<div class="add-row">
  <input
    type="text"
    placeholder="New course name (optional)"
    [(ngModel)]="newCourseName"
    name="newCourseName" />
  <button (click)="addSampleCourse()">+ Add Course (dispatch addCourse)</button>
</div>

<p *ngIf="loading$ | async">Loading courses...</p>
<p *ngIf="error$ | async as error" class="error">
  {{ error }}
</p>

<div class="grid" *ngIf="!(loading$ | async) && !(error$ | async)">
  <div class="card-wrapper" *ngFor="let course of (filteredCourses$ | async)">
    <app-course-card [course]="course" (cardClicked)="onCardClicked($event)"></app-course-card>
    <div class="row-actions">
      <button (click)="toggleStatus(course)">Toggle Status (PUT)</button>
      <button class="danger" (click)="removeCourse(course)">Delete (DELETE)</button>
    </div>
  </div>
</div>

<app-notification></app-notification>
