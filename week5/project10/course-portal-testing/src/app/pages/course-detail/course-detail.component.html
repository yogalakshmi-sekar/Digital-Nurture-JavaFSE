<div *ngIf="course; else notFound" class="detail-card">
  <a routerLink="/courses">&larr; Back to courses</a>
  <h3>{{ course.name }}</h3>
  <p><strong>Code:</strong> {{ course.code }}</p>
  <p><strong>Credits:</strong> {{ course.credits }}</p>
  <p><strong>Status:</strong> {{ course.gradeStatus }}</p>

  <h4>Enrolled Students</h4>
  <!-- Task 79/80 alt pattern: async pipe subscribes AND unsubscribes
       automatically when this component is destroyed — no manual
       subscribe()/unsubscribe() needed here. -->
  <ul *ngIf="(students$ | async) as students; else loadingStudents">
    <li *ngFor="let student of students">{{ student.name }}</li>
    <li *ngIf="!students.length" class="empty">No students enrolled yet.</li>
  </ul>
  <ng-template #loadingStudents><p>Loading students...</p></ng-template>
</div>

<ng-template #notFound>
  <p>No course found for that id. <a routerLink="/courses">Back to courses</a></p>
</ng-template>
