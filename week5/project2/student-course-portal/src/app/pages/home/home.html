<div class="home-container">

  <h1>Welcome to {{ portalName }}</h1>

  <p>
    Manage your courses, track your enrollment,
    and view your academic progress.
  </p>

  <button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<div>
  <label>Search Courses: </label>

  <input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Enter course name"
  >

  <p>Searching for: {{ searchTerm }}</p>
</div>



  <div class="stats">

    <div class="stat-card">
      <h3>Courses Available</h3>
      <p>12</p>
    </div>

    <div class="stat-card">
      <h3>Enrolled</h3>
      <p>3</p>
    </div>

    <div class="stat-card">
      <h3>GPA</h3>
      <p>3.8</p>
    </div>

  </div>

</div>
